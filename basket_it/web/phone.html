<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basket it · 휴대폰 화면 미리보기</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px;
    background: #101114; color: #F2F1EE;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  h1 { font-size: 18px; font-weight: 800; margin: 0; letter-spacing: -0.2px; }
  p { margin: 0; font-size: 13px; color: #9A9DA5; text-align: center; }
  .device {
    width: 390px; height: 844px; max-width: 100%;
    background: #000; border: 10px solid #17181B; border-radius: 44px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.8); overflow: hidden;
  }
  .device iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  a { color: #FF5B3D; font-size: 13px; }
  @media (max-width: 460px), (max-height: 900px) {
    body { padding: 0; gap: 0; justify-content: flex-start; }
    h1, p, a { display: none; }
    .device { width: 100vw; height: 100vh; border: 0; border-radius: 0; }
  }
</style>
</head>
<body>
  <h1>Basket it · 휴대폰 화면(390 × 844) 미리보기</h1>
  <p>휴대폰에서 열면 프레임 없이 전체 화면으로 보입니다.</p>
  <div class="device"><iframe src="/" title="Basket it"></iframe></div>
  <a href="/">프레임 없이 열기 →</a>
</body>
</html>
