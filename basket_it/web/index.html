<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KBL 팬을 위한 앱 — 경기 일정·결과, 실시간 점수, 선수 기록, 승부예측, 커뮤니티">

  <!-- 홈 화면에 추가하면 주소창 없이 앱처럼 뜬다. viewport-fit=cover는 아이폰
       노치 아래까지 화면을 쓰고, 안전 영역은 앱이 SafeArea로 피한다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Baskit">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Baskit</title>
  <link rel="manifest" href="manifest.json">

  <!-- 앱(Flutter)을 받는 동안 보여주는 로딩 화면. 앱의 켜질 때 로딩 화면
       (lib/features/auth/auth_gate.dart)과 같은 로고·동그라미라 넘어갈 때 튀지 않는다.
       앱이 첫 화면을 그리면(flutter-first-frame) 지운다. -->
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 40px;
      transition: opacity .2s;
    }
    /* 아이콘 PNG는 공이 칸을 거의 채워서, 주황 칸 안에 작게 넣어 앱 로고와 맞춘다. */
    #splash .logo {
      width: 120px; height: 120px; border-radius: 28px; background: #F97316;
      box-shadow: 0 0 40px 4px rgba(249, 115, 22, .35);
      display: flex; align-items: center; justify-content: center;
    }
    #splash img { width: 86px; height: 86px; }
    #splash .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(249, 115, 22, .2); border-top-color: #F97316;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .spinner { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Baskit 불러오는 중">
    <div class="logo"><img src="icons/Icon-192.png" alt=""></div>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 200);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
