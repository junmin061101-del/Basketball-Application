  <meta property="og:site_name" content="Baskit">
  <meta property="og:title" content="Baskit 바스킷 — KBL 농구 실시간 경기·순위·선수 기록·승부예측">
  <meta property="og:description" content="농구 실시간 경기 점수, KBL 일정·순위, 선수 기록, 승부예측, 농구 커뮤니티를 한곳에서.">

  <!-- 검색 결과의 사이트 이름(Baskit / 바스킷)과 로고. -->
  <script type="application/ld+json">
  [{"@context":"https://schema.org","@type":"WebSite","name":"Baskit","alternateName":["바스킷","Baskit 바스킷"],"url":"https://basket-it-kbl.web.app/"},
   {"@context":"https://schema.org","@type":"Organization","name":"Baskit","url":"https://basket-it-kbl.web.app/","logo":"https://basket-it-kbl.web.app/icons/Icon-512.png"},
   {"@context":"https://schema.org","@type":"WebApplication","name":"Baskit","alternateName":"바스킷","url":"https://basket-it-kbl.web.app/","applicationCategory":"SportsApplication","operatingSystem":"Web, Android, iOS","inLanguage":"ko","description":"KBL 농구 실시간 경기 점수, 경기 일정, 순위, 선수 기록, 승부예측, 농구 커뮤니티 앱","offers":{"@type":"Offer","price":"0","priceCurrency":"KRW"}}]

  <!-- 홈 화면에 추가하면 주소창 없이 앱처럼 뜬다. viewport-fit=cover는 아이폰
       노치 아래까지 화면을 쓰고, 안전 영역은 앱이 SafeArea로 피한다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Favicon. 구글 검색 결과 왼쪽 로고는 48px의 배수여야 한다. -->

  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">

  <title>Baskit 바스킷 — KBL 농구 실시간 경기·순위·선수 기록·승부예측</title>
  <link rel="manifest" href="manifest.json">

  <!-- 앱(Flutter)을 받는 동안 보여주는 로딩 화면. 앱의 켜질 때 로딩 화면
       (lib/features/auth/auth_gate.dart)과 같은 로고·동그라미라 넘어갈 때 튀지 않는다.
       앱이 첫 화면을 그리면(flutter-first-frame) 지운다. -->
  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 40px;
      transition: opacity .2s;
    }
    /* 아이콘 PNG는 공이 칸을 거의 채워서, 주황 칸 안에 작게 넣어 앱 로고와 맞춘다. */
    #splash .logo {
      width: 120px; height: 120px; border-radius: 28px; background: #F97316;
      box-shadow: 0 0 40px 4px rgba(249, 115, 22, .35);
      display: flex; align-items: center; justify-content: center;
    }
    #splash img { width: 86px; height: 86px; }
    #splash .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(249, 115, 22, .2); border-top-color: #F97316;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .spinner { animation-duration: 2.4s; } }
  </style>
</head>
<body>
  <script>
    // 손가락으로 밀어 뒤로 가면 브라우저 뒤로 가기가 온다. Flutter는 기록을
    // "시작 지점" 한 칸 위에 "앱" 한 칸만 두고, 뒤로 가기가 오면 앱 칸을 다시
    // 쌓으며 화면 하나를 닫는다. 빠르게 두 번 밀면 다시 쌓기 전에 시작 지점
    // 아래로 내려가 앱 밖으로 나가 버려 앱을 처음부터 다시 불러왔다.
    // 시작 지점 아래에 Flutter가 시작 지점으로 알아보는 칸을 여럿 깔아, 빠르게
    // 밀어도 앱 안에 머물며 화면만 하나씩 닫히게 한다. 새로고침이면(이미 앱 칸)
    // 다시 깔지 않는다.
    (function () {
      var s = history.state;
      if (s && (s.flutter || s.origin)) return;
      var origin = { origin: true, state: null };
      history.replaceState(origin, '');
      for (var i = 0; i < 12; i++) history.pushState(origin, '');
    })();
  </script>
  <!-- 자바스크립트 없이 읽는 검색엔진·사용자용. -->
  <noscript>
    <h1>Baskit(바스킷) — KBL 농구 실시간 경기·순위·선수 기록·승부예측</h1>
    <p>KBL 농구 실시간 경기 점수, 경기 일정·결과, 순위, 선수 기록, 승부예측, 농구 커뮤니티, KBL·NBA 뉴스를 한곳에서 보는 무료 농구 앱이에요.</p>
    <p><a href="/about/">Baskit 소개</a> · <a href="/kbl/">KBL 10개 구단·선수 명단</a></p>
  </noscript>
  <div id="splash" role="progressbar" aria-label="Baskit 불러오는 중">
    <div class="logo"><img src="icons/Icon-192.png" alt=""></div>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 200);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.

    or to give the user feedback during the initialization process.

    For more details:

  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
