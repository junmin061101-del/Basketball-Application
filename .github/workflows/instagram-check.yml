# 인스타 게시 토큰(IG_ACCESS_TOKEN)이 동작하는지 확인한다. 조회만 하고 게시하지 않는다.
# 확인 스크립트를 바꾸면 돌고, Actions 탭에서 손으로도 돌릴 수 있다.
name: 인스타 토큰 확인

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'basket_it/tools/instagram/check-token.js'
      - '.github/workflows/instagram-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 토큰 확인
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node basket_it/tools/instagram/check-token.js
